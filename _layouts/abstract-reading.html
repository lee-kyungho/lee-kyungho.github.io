<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} | Kyungho Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="icon" href="/assets/images/yale_favicon.ico">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: #202124; font-family: 'Source Serif 4', Georgia, serif; }
main { max-width: 48rem; margin: 0 auto; padding: 4rem 1.5rem; }
h1 { font-size: clamp(1.1rem, 2vw, 1.4rem); font-weight: 600; line-height: 1.3; margin: 0 0 2rem; }
.title-main { font-size: clamp(1.65rem, 3vw, 2.25rem); }
p { font-family: Arial, Helvetica, sans-serif; font-size: 1.0625rem; font-weight: 400; line-height: 1.4; margin: 0 0 1.4rem; text-align: justify; hyphens: none; }
@media (max-width: 600px) { main { padding: 2rem 1.25rem; } p { text-align: left; } }
.reading-actions { display: flex; justify-content: flex-end; margin-top: 2rem; }
.back-button { display: inline-block; font: 500 0.9375rem Arial, Helvetica, sans-serif; color: #00356b; background: #fff; border: 1px solid #00356b; border-radius: 6px; padding: 0.625rem 1rem; text-decoration: none; }
.back-button:hover { background: #00356b; color: #fff; }
.back-button:focus-visible { outline: 2px solid #00356b; outline-offset: 3px; }
</style>
</head>
<body><main>{{ content }}<div class="reading-actions"><a class="back-button" href="/{{ page.return_anchor | default: '#automation-market-power' }}">Back to main page</a></div></main>
<script>
document.querySelector('.back-button').addEventListener('click', function (event) {
  if (!document.referrer) return;
  var previous = new URL(document.referrer);
  if (previous.origin === location.origin && previous.pathname === '/' && history.length > 1) {
    event.preventDefault();
    history.back();
  }
});
</script>
</body>
</html>
